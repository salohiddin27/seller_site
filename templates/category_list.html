<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; margin: 0; }
        .search-box { text-align: center; margin: 30px 0; }
        .search-box input {
            padding: 10px;
            width: 300px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        .search-box button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
            gap: 20px;
            padding: 0 20px;
        }

        .category-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .category-card:hover { transform: translateY(-5px); }

        .category-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .category-card h3 {
            padding: 12px 0;
            color: #333;
        }
    </style>
</head>
<body>

<!-- SEARCH -->
<div class="search-box">
    <form method="get">
        <input type="text" name="search" placeholder="Search category..."
               value="{{ search|default:'' }}">
        <button type="submit">Search</button>
    </form>
</div>

<!-- CATEGORIES -->
<div class="container">
    {% for category in categories %}
        <a href="{% url 'category_products' category.id %}">
            <div class="category-card">
                <img src="{{ category.photo.url }}" alt="{{ category.name }}">
                <h3>{{ category.name }}</h3>
            </div>
        </a>
    {% empty %}
        <p style="text-align:center;">No categories found.</p>
    {% endfor %}
</div>

</body>
</html>
